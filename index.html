<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Daimoku tracker</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>

<main class="card landing">

  <h1>Daimoku tracker</h1>
  <p class="sub">Select your chapter and district</p>

  <label for="chapter">Chapter</label>
  <select id="chapter">
    <option value="">Select chapter</option>
    <option value="HUDA">HUDA</option>
    <option value="Kanishka">Kanishka</option>
  </select>

  <label for="district">District</label>
  <select id="district" disabled>
    <option value="">Select chapter first</option>
  </select>

  <button id="proceed" type="button" disabled>Proceed</button>
  <p class="msg bad" id="lmsg"></p>

</main>

<script src="land.js"></script>
</body>
</html>
